<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">

    <title>Resultado das Notas</title>
</head>

<body class="bg-light">

    <!-- Menu -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Sistema de Notas
            </span>
        </div>
    </nav>


    <!-- Conteúdo -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Resultado do Aluno</h4>
                    </div>

                    <div class="card-body p-4">

                        <form id="formulario">

                            <!-- Nome -->
                            <div class="mb-4">
                                <label for="nome" class="form-label">
                                    Nome do aluno
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="nome"
                                    placeholder="Digite o nome">
                            </div>


                            <!-- Notas -->
                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="nota1" class="form-label">
                                        Nota 1
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        id="nota1"
                                        min="0"
                                        max="10"
                                        step="0.1">
                                </div>


                                <div class="col-md-6 mb-3">
                                    <label for="nota2" class="form-label">
                                        Nota 2
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        id="nota2"
                                        min="0"
                                        max="10"
                                        step="0.1">
                                </div>


                                <div class="col-md-6 mb-3">
                                    <label for="nota3" class="form-label">
                                        Nota 3
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        id="nota3"
                                        min="0"
                                        max="10"
                                        step="0.1">
                                </div>


                                <div class="col-md-6 mb-3">
                                    <label for="nota4" class="form-label">
                                        Nota 4
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        id="nota4"
                                        min="0"
                                        max="10"
                                        step="0.1">
                                </div>

                            </div>


                            <!-- Média -->
                            <div class="alert alert-info text-center mt-3">
                                <span>Média atual:</span>
                                <strong id="media">0.0</strong>
                            </div>


                            <!-- Botão -->
                            <button type="submit" class="btn btn-primary w-100">
                                Ver Resultado
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
