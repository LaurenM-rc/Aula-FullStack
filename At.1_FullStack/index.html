<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <title>Consulta de CEP - ViaCEP</title>

</head>

<body>

    <div class="container-fluid text-center">
      
      <!--Cabeçalho-->

        <div class="row">
            <div class="col bg-primary text-white p-3">
                <h1>Consulta de CEP</h1>
            </div>
        </div>

      <!--Formulário-->

        <div class="row mt-5">

            <div class="col-3"></div>
            
            <div class="col-6 border rounded p-4 shadow">
                
              <h2 class="mb-4">Formulário</h2>

                <form id="formCep">
                    <div class="form-floating mb-3">

                      <input
                          type="text"
                          id="cep"
                          name="cep"
                          class="form-control"
                          placeholder="CEP"
                          maxlength="9"
                      required>

                      <label for="floatingInput">CEP</label>

                      <div id="erroCep" class="invalid-feedback">Digite um CEP válido!</div>
                      
                      </div>

                    <input
                        type="submit"
                        value="Consultar"
                        class="btn btn-success">

                    <button
                        type="button"
                        id="limpar"
                        class="btn btn-danger">
                        Limpar
                    </button>

                </form>

                <!-- Mensagem -->
                <div id="mensagem" class="mt-3"></div>

                <!-- Dados do endereço -->
                <div id="endereco" class="mt-4 text-start">

                    <div class="row">

                        <div class="form-floating col-md-12 mb-3">
                          
                            <input
                                type="text"
                                id="logradouro"
                                name="logradouro"
                                class="form-control"
                                placeholder="Logradouro"
                            required>
                            
                            <label for="logradouro" class="form-label">Logradouro</label>

                        </div>

                    <div class="row">

                        <div class="form-floating col-md-6 mb-3">

                            <input
                                type="text"
                                id="bairro"
                                name="bairro"
                                class="form-control"
                                placeholder="Bairro"
                            required>

                            <label for="bairro" class="form-label">Bairro</label>   

                        </div>

                        <div class="form-floating col-md-6 mb-3">

                          <input
                              type="text"
                              id="localidade"
                              name="localidade"
                              class="form-control"
                              placeholder="Cidade"
                            required>

                            <label for="localidade" class="form-label">Cidade</label>

                        </div>

                    </div>

                    <div class="row">

                        <div class="form-floating col-md-6 mb-3">

                          <input
                              type="text"
                              id="uf"
                              name="uf"
                              class="form-control"
                              placeholder="Estado"    
                            required>

                            <label for="uf" class="form-label">Estado</label>
                                
                        </div>

                        <div class="form-floating col-md-6 mb-3">

                            <input
                                type="text"
                                id="ibge"
                                name="ibge"
                                class="form-control"
                                placeholder="IBGE"
                            required>

                            <label for="ibge" class="form-label">IBGE</label>

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-3"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
